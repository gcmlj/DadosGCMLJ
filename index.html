<!DOCTYPE html>
<html>
<head>
  <title>Sistema de Dados GCMLJ</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background-color: #f4f6f9;
    }

    header {
      background-color: #1f2937;
      color: white;
      padding: 15px;
      text-align: center;
      font-size: 18px;
      font-weight: bold;
      letter-spacing: 1px;
    }

    #loader {
      position: fixed;
      width: 100%;
      height: 100vh;
      background: #f4f6f9;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      color: #333;
      z-index: 9999;
    }

    iframe {
      width: 100%;
      height: calc(100vh - 60px);
      border: none;
      display: none;
    }
  </style>

  <script>
    function carregarApp() {
      document.getElementById("loader").style.display = "none";
      document.getElementById("appFrame").style.display = "block";
    }
  </script>
</head>

<body>

  <header>
    Sistema de Dados GCMLJ
  </header>

  <div id="loader">
    Carregando sistema...
  </div>

  <iframe 
    id="appFrame"
    src="https://script.google.com/macros/s/AKfycbyRmThZlQqTm9_plrDuFFKVJ8ZNS-2PfZDuzwEqAKd49x_ODSj5iYZ5IqBYsyRDRtgQSA/exec"
    onload="carregarApp()">
  </iframe>

</body>
</html>
